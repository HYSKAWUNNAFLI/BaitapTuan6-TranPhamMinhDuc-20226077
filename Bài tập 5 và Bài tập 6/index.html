<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa hàng Sách ABC (Nâng cao)</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Cửa hàng Sách ABC</h1>
        <nav>
            <ul>
                <li><a href="#">Trang chủ</a></li>
                <li><a href="#">Sản phẩm</a></li>
                <li><a href="#">Liên hệ</a></li>
            </ul>
        </nav>
    </header>

    <main>
        
        <section id="intro">
            <h2>Chào mừng đến với Cửa hàng Sách ABC</h2>
            <p>Nơi khám phá tri thức và những cuộc phiêu lưu qua từng trang sách.</p>
        </section>

        <section id="product-section">
            <h2>Sản phẩm nổi bật</h2>

            <div id="search-container">
                <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm...">
                <button id="searchBtn">Tìm</button>
            </div>

            <button id="addProductBtn">Thêm sản phẩm mới</button>

            <form id="addProductForm">
                <h3>Thêm sản phẩm mới</h3>
                
                <div>
                    <label for="newName">Tên sản phẩm:</label>
                    <input type="text" id="newName" required>
                </div>
                <div>
                    <label for="newPrice">Giá (VNĐ):</label>
                    <input type="number" id="newPrice" required>
                </div>
                <div>
                    <label for="newDesc">Mô tả:</label>
                    <textarea id="newDesc" rows="3"></textarea>
                </div>
                <div>
                    <label for="newImage">Link ảnh (tùy chọn):</label>
                    <input type="text" id="newImage" placeholder="https://...">
                </div>
                
                <p id="errorMsg" class="error-message"></p> 

                <button type="submit">Thêm</button>
                <button type="button" id="cancelBtn">Hủy</button>
            </form>

            <section id="product-list">
                </section>
            
        </section> <section id="contact">
            <h2>Liên hệ với chúng tôi</h2>
            <form id="contact-form">
                <div>
                    <label for="name">Họ tên:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="message">Lời nhắn:</label>
                    <textarea id="message" name="message" rows="4"></textarea>
                </div>
                <button type="submit">Gửi</button>
            </form>
        </section>
        
    </main>

    <footer>
        <p>&copy; 2025 Cửa hàng Sách ABC. Mọi quyền được bảo lưu.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
